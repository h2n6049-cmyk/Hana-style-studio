<style>
:root{--bg:#171513;--card:#211D19;--ink:#F4EEE5;--mute:#B6A99A;--line:#40372F;--sad:#B88A4A;--stitch:#D4B477;--ok:#2F5D4A;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211D19;--ink:#F4EEE5;--mute:#B6A99A;--line:#40372F;--sad:#B88A4A;--stitch:#D4B477;--ok:#6FB59A;--on:#1B1513}}
:root[data-theme="dark"]{--bg:#171513;--card:#211D19;--ink:#F4EEE5;--mute:#B6A99A;--line:#40372F;--sad:#B88A4A;--stitch:#D4B477;--ok:#6FB59A;--on:#1B1513}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Vazirmatn",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;direction:rtl;text-align:right}
header{padding:18px 16px 12px;text-align:right;border-bottom:2px dashed var(--stitch);margin:0 12px}

h2{font:700 21px "Playfair Display",Georgia,serif;margin:4px 0 10px}
h3{font:600 15px "Vazirmatn",Tahoma,sans-serif;margin:20px 0 8px;color:var(--mute)}
.mute{color:var(--mute);font-size:14px}
.note{background:var(--card);border:1px dashed var(--stitch);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.card{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px}
.top{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:4px}
.top .st{margin-right:auto;font-weight:600;color:var(--ink)}
.pill{background:var(--sad);color:var(--on);border-radius:99px;padding:1px 9px;font-weight:600;font-size:12px}
.h{font-weight:600}
.btn{font:600 16px "Vazirmatn",Tahoma,sans-serif;min-height:48px;padding:0 18px;border-radius:10px;border:2px solid var(--sad);background:var(--sad);color:var(--on)}
.btn.ghost{background:transparent;color:var(--sad)}
.btn.full{width:100%}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.row>*{flex:1}
label{display:block;font-size:14px;color:var(--mute);margin-top:10px}
input,select,textarea{display:block;direction:rtl;text-align:right;width:100%;min-height:46px;margin-top:4px;padding:10px;font:16px "Vazirmatn",Tahoma,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:700 22px "Playfair Display",Georgia,serif}
.kpi span{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:4px;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--sad);border-radius:4px}
.good{color:var(--ok);font-weight:600}
pre{white-space:pre-wrap;font:15px/1.5 "Vazirmatn",Tahoma,sans-serif;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:58px;border:0;background:none;font:500 13px "Vazirmatn",Tahoma,sans-serif;color:var(--mute);direction:rtl}
nav button.on{color:var(--sad);font-weight:600;box-shadow:inset 0 3px 0 var(--sad)}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;z-index:5}
#sheet.open{display:flex}
.panel{background:var(--card);direction:rtl;text-align:right;width:100%;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:9}
.bad{color:#C0513F;font-weight:600}
:focus-visible{outline:3px solid var(--stitch);outline-offset:2px}

:root{--bg:#090807;--card:#15120f;--ink:#f3eadc;--mute:#b9a991;--line:#493a2b;--sad:#b58a55;--stitch:#d8bd91;--ok:#91b59a;--on:#100c08}

<body>
<header class="brand-header"><div class="brand-emblem" aria-label="HANA monogram">H<span>✦</span></div><div class="brand-copy"><b>HANA STYLE</b><span class="brand-studio">S T U D I O</span><span class="brand-tag">MAISON DE STYLE · IRANIAN HERITAGE</span><span id="sub">استودیو مدیریت برند</span></div></header>
<div id="main"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>+v||0;
const dstr=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fd=d=>d?new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(new Date(d+'T00:00:00')):'';
const CUR='تومان';
const nd=s=>String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/٫/g,'.').replace(/[٬،,\s]/g,'');
const NF=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:0});
const LABEL={Reel:'ریلز',Post:'پست',Story:'استوری',Idea:'ایده',Planned:'برنامه‌ریزی‌شده',Posted:'منتشرشده',New:'جدید',Making:'در حال آماده‌سازی',Shipped:'ارسال‌شده',Done:'تکمیل‌شده',Cancelled:'لغوشده',Instagram:'اینستاگرام','Direct message':'پیام مستقیم',Market:'بازارچه',Website:'وب‌سایت',Other:'سایر',leather:'چرم',hardware:'یراق‌آلات',thread:'نخ و ملزومات',labor:'دستمزد',other:'سایر هزینه‌ها'};
const fa=v=>LABEL[v]||v;
const money=n=>'<bdi>'+NF.format(Math.round(num(n)))+' '+CUR+'</bdi>';
const KEY='hana-style-v1';
let canSave=true,S,tab='plan',gen=null,scr=null,scrIndex=null,ai='',aiOn=false,sel={p:'',g:'making',f:'Reel'};

function seed(){const mk=(id,name,price,stock,l,h,t,w,o)=>{const c={leather:l,hardware:h,thread:t,labor:w,other:o};return{id,name,price,stock,costs:c,cost:tot(c)}};return{sample:true,cur:'toman',v:2,
products:[mk('p1','Card holder',2200000,12,350000,50000,60000,300000,140000),mk('p2','Bifold wallet',4500000,6,800000,200000,100000,700000,200000),mk('p3','Key fob',1000000,20,100000,80000,30000,120000,70000)],
posts:[{id:'c1',type:'Reel',date:dstr(2),status:'Planned',title:'Making a card holder in 30 seconds',caption:'',reach:'',likes:'',saves:'',comments:'',clicks:''},
{id:'c2',type:'Story',date:dstr(1),status:'Planned',title:'Poll: which colour next?',caption:'',reach:'',likes:'',saves:'',comments:'',clicks:''},
{id:'c3',type:'Reel',date:dstr(-6),status:'Posted',title:'Edge burnishing close-up',caption:'',reach:2400,likes:180,saves:64,comments:9,clicks:21},
{id:'c4',type:'Post',date:dstr(-3),status:'Posted',title:'Bifold wallet flat lay',caption:'',reach:1100,likes:95,saves:12,comments:4,clicks:7}],
orders:[{id:'o1',date:dstr(-4),customer:'Anna K.',product:'p2',qty:1,price:4500000,cost:2000000,status:'Shipped',source:'Instagram'},
{id:'o2',date:dstr(-1),customer:'Market stall',product:'p1',qty:3,price:2200000,cost:900000,status:'Done',source:'Market'}]}}
const CK=['leather','hardware','thread','labor','other'];
const tot=c=>CK.reduce((s,k)=>s+num(c&&c[k]),0);
function migrate(d){d.v=2;(d.products||[]).forEach(p=>{if(!p.costs)p.costs={leather:0,hardware:0,thread:0,labor:0,other:num(p.cost)};p.cost=tot(p.costs)});return d}
const hasOld=()=>{try{return !!localStorage.getItem(KEY+'-pre-toman')}catch(e){return false}};
let storageIssue='';
const EMPTY_DATA=()=>({sample:false,cur:'toman',v:2,products:[],posts:[],orders:[]});
function parseStored(raw){
  if(!raw) return null;
  const d=JSON.parse(raw);
  if(!d||!Array.isArray(d.products)||!Array.isArray(d.posts)||!Array.isArray(d.orders))throw new Error('ساختار اطلاعات ناقص است');
  return migrate(d);
}
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      try{
        const d=parseStored(r);
        if(!d.v){try{if(!localStorage.getItem(KEY+'-pre-toman'))localStorage.setItem(KEY+'-pre-toman',r)}catch(e){}}
        return d;
      }catch(primaryError){
        // Recover only from a previously validated snapshot; never seed over damaged data.
        try{
          const good=parseStored(localStorage.getItem(KEY+'-last-good'));
          if(good){storageIssue='نسخه اصلی اطلاعات قابل خواندن نبود؛ آخرین نسخه سالم محلی بارگذاری شد. برای اطمینان، همین حالا یک فایل پشتیبان دانلود کن.';return good;}
        }catch(e){}
        storageIssue='اطلاعات ذخیره‌شده قابل خواندن نیست و نسخه سالم محلی هم پیدا نشد. برای جلوگیری از بازنویسی، ذخیره خودکار متوقف شده است؛ فایل پشتیبان را بازیابی کن.';canSave=false;return EMPTY_DATA();
      }
    }
    // A missing primary key may be caused by a partial browser-storage reset.
    try{const good=parseStored(localStorage.getItem(KEY+'-last-good'));if(good){storageIssue='اطلاعات اصلی پیدا نشد؛ آخرین نسخه سالم محلی بارگذاری شد. یک فایل پشتیبان تازه دانلود کن.';return good;}}catch(e){}
    return seed();
  }catch(e){storageIssue='دسترسی به حافظه مرورگر ممکن نیست. فعلاً اطلاعات جدید وارد نکن.';canSave=false;return EMPTY_DATA();}
}
function save(){
  try{
    const previous=localStorage.getItem(KEY);
    const next=JSON.stringify(S);
    localStorage.setItem(KEY,next);
    if(previous && previous!==next){
      try{parseStored(previous);localStorage.setItem(KEY+'-last-good',previous)}catch(e){}
    }
    canSave=true;return true;
  }catch(e){canSave=false;return false}
}
const BACKUP_META=KEY+'-backup-meta', SAFETY_KEY=KEY+'-before-restore';
function backupReminder(){
  let last=0;try{last=+(localStorage.getItem(BACKUP_META)||0)}catch(e){}
  if(!last)return 'هنوز از این نسخه خروجی پشتیبان ثبت نشده است. پیشنهاد: پس از هر روز کاری یا تغییر مهم، فایل پشتیبان را دانلود و در Google Drive نگهداری کن.';
  const days=Math.floor((Date.now()-last)/86400000);
  return days>=7?'از آخرین خروجی پشتیبان بیش از یک هفته گذشته است؛ یک نسخه تازه تهیه کن.':'آخرین خروجی پشتیبان ثبت‌شده: '+new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(last))+' · برای اطمینان، فایل را خارج از گوشی هم نگه دار.';
}
function backupEnvelope(data){return {app:'HANA Style Studio',backupVersion:1,createdAt:new Date().toISOString(),data:data}}
function downloadJSON(obj,name){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function hasSafety(){try{return !!localStorage.getItem(SAFETY_KEY)}catch(e){return false}}
function hasLastGood(){try{return !!localStorage.getItem(KEY+'-last-good')}catch(e){return false}}
function validBackup(d){
  const x=d&&d.data?d.data:d;
  return !!(x&&Array.isArray(x.products)&&Array.isArray(x.posts)&&Array.isArray(x.orders));
}
function applyBackup(d){
  const x=d&&d.data?d.data:d;
  if(!validBackup(d))return toast('فایل پشتیبان معتبر نیست یا ساختار آن کامل نیست.');
  // Preserve both the visible app state and any unreadable raw primary value.
  try{
    localStorage.setItem(SAFETY_KEY,JSON.stringify(backupEnvelope(S)));
    const raw=localStorage.getItem(KEY);
    if(raw){try{parseStored(raw)}catch(e){localStorage.setItem(KEY+'-corrupt',raw)}}
  }catch(e){return toast('نسخه ایمنی ساخته نشد؛ بازیابی انجام نشد تا اطلاعات فعلی در خطر نیفتد.')}
  const previous=JSON.parse(localStorage.getItem(SAFETY_KEY)).data;
  const oldIssue=storageIssue;storageIssue='';S=migrate(JSON.parse(JSON.stringify(x)));
  if(!save()){S=previous;storageIssue=oldIssue;return toast('ذخیره نسخه بازیابی‌شده تأیید نشد؛ اطلاعات قبلی حفظ شد. فضای ذخیره‌سازی را بررسی کن.')}
  closeSheet();render();toast('اطلاعات بازیابی شد؛ نسخه ایمنی قبلی هم نگهداری شد.');
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
function upsert(k,o){const a=S[k],i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;save();closeSheet();render()}
function del(k,id){const n=S[k].length;S[k]=S[k].filter(x=>x.id!==id);const ok=S[k].length<n;save();closeSheet();render();toast(!ok?'موردی برای حذف پیدا نشد':canSave?'حذف شد':'حذف شد، اما مرورگر نتوانست تغییر را ذخیره کند')}
function closeSheet(){$('#sheet').classList.remove('open')}
function askSheet(t,h,ok,fn){$('#sheet').innerHTML=`<div class="panel" role="dialog" aria-label="${esc(t)}"><h2>${esc(t)}</h2>${h}<div class="row"><button class="btn" id="ok">${esc(ok)}</button><button class="btn ghost" id="cx">انصراف</button></div></div>`;$('#sheet').classList.add('open');$('#cx').onclick=closeSheet;$('#ok').onclick=fn}
const SMP={products:{p1:'Card holder',p2:'Bifold wallet',p3:'Key fob'},posts:{c1:'Making a card holder in 30 seconds',c2:'Poll: which colour next?',c3:'Edge burnishing close-up',c4:'Bifold wallet flat lay'},orders:{o1:'Anna K.',o2:'Market stall'}};
const isSample=(k,o)=>SMP[k][o.id]!==undefined&&SMP[k][o.id]===(k==='products'?o.name:k==='posts'?o.title:o.customer);
function samplePlan(){const used=new Set(S.orders.filter(o=>!isSample('orders',o)).map(o=>o.product));const sp=S.products.filter(p=>isSample('products',p));return{products:sp.filter(p=>!used.has(p.id)),keptP:sp.filter(p=>used.has(p.id)),posts:S.posts.filter(p=>isSample('posts',p)),orders:S.orders.filter(o=>isSample('orders',o))}}

function sheet(title,fields,vals,onSave,onDel,onInput){
  const fh=f=>{const v=esc(vals[f.k]);
    if(f.t==='area')return `<textarea id="f_${f.k}" rows="3">${v}</textarea>`;
    if(f.t==='select')return `<select id="f_${f.k}">${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return `<option value="${esc(a)}"${a==vals[f.k]?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;
    return f.t==='number'?`<input id="f_${f.k}" type="text" inputmode="numeric" autocomplete="off" value="${v}">`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${v}">`};
  $('#sheet').innerHTML=`<div class="panel" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${fields.map(f=>f.t==='info'?'<div id="live" class="note"></div>':`<label>${f.l}${fh(f)}</label>`).join('')}<div class="row"><button class="btn" id="sv">ذخیره</button>${onDel?'<button class="btn ghost" id="dl">حذف</button>':''}<button class="btn ghost" id="cx">انصراف</button></div></div>`;
  $('#sheet').classList.add('open');
  $('#cx').onclick=closeSheet;
  if(onInput){$('#sheet .panel').addEventListener('input',onInput);onInput()}
  $('#sv').onclick=()=>{const v={};fields.forEach(f=>{if(f.t==='info')return;const x=$('#f_'+f.k).value;v[f.k]=f.t==='number'?(x===''?'':num(nd(x))):x});onSave(v)};
  if(onDel)$('#dl').onclick=()=>{const what=String(title).replace(/^(Edit|New) /,'');askSheet('حذف '+what+'؟','<p>این مورد حذف خواهد شد. این کار قابل بازگشت نیست.</p>','حذف',()=>{try{onDel()}catch(e){closeSheet();toast('حذف انجام نشد و تغییری ایجاد نشد.')}})};
}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

const TYPES=['Reel','Post','Story'],STAT=['Idea','Planned','Posted'],OST=['New','Making','Shipped','Done','Cancelled'],SRC=['Instagram','Direct message','Market','Website','Other'];
function postSheet(id){const p=S.posts.find(x=>x.id===id)||{id:uid(),type:'Reel',date:dstr(0),status:'Planned',title:'',caption:'',script:'',reach:'',likes:'',saves:'',comments:'',clicks:''};
  sheet(id?'ویرایش محتوا':'محتوای جدید',[{k:'title',l:'ایده یا عنوان'},{k:'type',l:'نوع محتوا',t:'select',o:TYPES.map(x=>[x,fa(x)])},{k:'date',l:'تاریخ',t:'date'},{k:'status',l:'وضعیت',t:'select',o:STAT.map(x=>[x,fa(x)])},{k:'caption',l:'کپشن یا یادداشت',t:'area'},{k:'script',l:'سناریوی ویدئو',t:'area'},
  {k:'reach',l:'دسترسی (پس از انتشار)',t:'number'},{k:'likes',l:'پسندها',t:'number'},{k:'saves',l:'ذخیره‌ها',t:'number'},{k:'comments',l:'دیدگاه‌ها',t:'number'},{k:'clicks',l:'کلیک روی پیوند',t:'number'}],p,
  v=>{if(!v.title.trim())return toast('ابتدا عنوان را وارد کن');upsert('posts',{...p,...v})},id?()=>del('posts',p.id):null)}
function prodSheet(id){const p=S.products.find(x=>x.id===id)||{id:uid(),name:'',price:'',stock:'',costs:{}};
  const vals={...p};CK.forEach(k=>vals['c_'+k]=(p.costs||{})[k]||'');
  const L=[['leather','چرم'],['hardware','یراق‌آلات'],['thread','نخ و ملزومات'],['labor','دستمزد'],['other','سایر هزینه‌ها']];
  const F=[{k:'name',l:'نام محصول'},{k:'price',l:'قیمت فروش ('+CUR+')',t:'number'},...L.map(([k,l])=>({k:'c_'+k,l:l+' ('+CUR+')',t:'number'})),{k:'live',t:'info'},{k:'stock',l:'موجودی',t:'number'}];
  const g=k=>num(nd($('#f_'+k).value));
  const live=()=>{const t=CK.reduce((s,k)=>s+g('c_'+k),0),pr=g('price'),f=pr-t;$('#live').innerHTML=`مجموع هزینه <b>${money(t)}</b><br>سود <b class="${f<0?'bad':'good'}">${money(f)}</b> · حاشیه سود <b>${pr?Math.round(f/pr*100):0}%</b>`};
  sheet(id?'ویرایش محصول':'محصول جدید',F,vals,
  v=>{if(!v.name.trim())return toast('ابتدا نام محصول را وارد کن');const c={};CK.forEach(k=>c[k]=num(v['c_'+k]));upsert('products',{...p,name:v.name,price:v.price,stock:v.stock,costs:c,cost:tot(c)})},id?()=>del('products',p.id):null,live)}
function orderSheet(id){if(!S.products.length)return toast('ابتدا یک محصول ثبت کن');
  const o=S.orders.find(x=>x.id===id)||{id:uid(),date:dstr(0),customer:'',product:S.products[0].id,qty:1,price:'',status:'New',source:'Instagram'};
  sheet(id?'ویرایش سفارش':'سفارش جدید',[{k:'customer',l:'نام مشتری'},{k:'product',l:'محصول',t:'select',o:S.products.map(p=>[p.id,p.name])},{k:'qty',l:'تعداد',t:'number'},{k:'price',l:'قیمت هر عدد (خالی = قیمت محصول)',t:'number'},{k:'status',l:'وضعیت سفارش',t:'select',o:OST.map(x=>[x,fa(x)])},{k:'source',l:'منبع سفارش',t:'select',o:SRC.map(x=>[x,fa(x)])},{k:'date',l:'تاریخ',t:'date'}],o,
  v=>{const p=S.products.find(x=>x.id===v.product);upsert('orders',{...o,...v,qty:v.qty||1,price:v.price===''?num(p.price):v.price,cost:o.cost!==undefined&&id?o.cost:num(p.cost)})},id?()=>del('orders',o.id):null)}

const prod=id=>S.products.find(p=>p.id===id)||{name:'(محصول حذف‌شده)'};
const live=o=>o.status!=='Cancelled';
const VIEWS={
plan(){const a=[...S.posts].sort((x,y)=>(x.status==='Posted')-(y.status==='Posted')||(x.status==='Posted'?y.date.localeCompare(x.date):x.date.localeCompare(y.date)));
  const n=S.posts.filter(p=>p.status!=='Posted').length;

  (a.map(p=>`<button class="card" data-a="editPost" data-id="${p.id}"><div class="top"><span class="pill">${fa(p.type)}</span><span>${fd(p.date)}</span><span class="st">${fa(p.status)}</span></div><div class="h">${esc(p.title)}</div>${p.script?'<div class="mute">سناریو ذخیره شده</div>':''}${p.status==='Posted'?`<div class="mute">${NF.format(num(p.reach))} دسترسی · ${NF.format(NF.format(num(p.likes)))} پسند · ${NF.format(num(p.saves))} ذخیره · ${NF.format(NF.format(num(p.clicks)))} کلیک</div>`:''}</button>`).join('')||' <p class="mute">هنوز محتوایی برنامه‌ریزی نشده است. اولین ایده‌ات را اضافه کن یا از بخش ایده‌ها کمک بگیر.</p>')},
products(){return `<h2>محصولات</h2>${S.cur!=='toman'&&S.products.length?'<div class="note">مبالغ ذخیره‌شده با یورو وارد شده‌اند. پس از تهیه نسخه پشتیبان، آن‌ها را یک‌بار به تومان تبدیل کن.<button class="btn ghost full" style="margin-top:8px" data-a="conv">تبدیل مبالغ یورو به تومان</button></div>':''}<button class="btn full" data-a="newProd">افزودن محصول</button><div style="height:12px"></div>`+
  (S.products.map(p=>{const pr=num(p.price)-num(p.cost),m=p.price?Math.round(pr/p.price*100):0;
  return `<button class="card" data-a="editProd" data-id="${p.id}"><div class="top"><span class="h" style="color:var(--ink);font-size:16px">${esc(p.name)}</span><span class="st">${money(p.price)}</span></div><div class="mute">هزینه ${money(p.cost)} · سود <span class="${pr<0?'bad':'good'}">${money(pr)}</span> (${NF.format(m)}٪) · موجودی: ${NF.format(num(p.stock))}</div></button>`}).join('')||' <p class="mute">برای ثبت قیمت و محاسبه سود، اولین محصولت را اضافه کن.</p>')},
orders(){const a=[...S.orders].sort((x,y)=>y.date.localeCompare(x.date));
  return `<h2>سفارش‌ها</h2><button class="btn full" data-a="newOrder">ثبت سفارش جدید</button><div style="height:12px"></div>`+
  (a.map(o=>`<button class="card" data-a="editOrder" data-id="${o.id}"><div class="top"><span>${fd(o.date)}</span><span>${esc(fa(o.source))}</span><span class="st">${fa(o.status)}</span></div><div class="h">${esc(o.customer)||'مشتری'}: ${num(o.qty)} × ${esc(prod(o.product).name)}</div><div class="mute">${money(num(o.qty)*num(o.price))} مجموع سفارش</div></button>`).join('')||' <p class="mute">هنوز سفارشی ثبت نشده است.</p>')},
ideas(){const names=S.products.map(p=>p.name);
  const gl=[['making','نمایش مراحل ساخت'],['proof','اعتمادسازی و تجربه مشتری'],['teach','آموزش'],['sell','معرفی و فروش']];
  return `<h2>ایده‌ها و سناریوی ریلز</h2><label>محصول<select data-v="p">${names.map(n=>`<option${n===sel.p?' selected':''}>${esc(n)}</option>`).join('')}<option value=""${sel.p===''?' selected':''}>هانا استایل (عمومی)</option></select></label>
  <label>هدف<select data-v="g">${gl.map(([k,l])=>`<option value="${k}"${k===sel.g?' selected':''}>${l}</option>`).join('')}</select></label>
  <label>قالب محتوا<select data-v="f">${TYPES.map(t=>`<option value="${t}"${t===sel.f?' selected':''}>${fa(t)}</option>`).join('')}</select></label>
  <div class="row"><button class="btn" data-a="gen">دریافت ایده</button>${aiOn?'<button class="btn ghost" data-a="ask">کمک گرفتن از کلود</button>':''}</div>`+
  (gen?`<h3>ایده‌های پیشنهادی</h3>`+gen.map((g,i)=>`<div class="card"><div class="h">${esc(g.title)}</div><div class="row"><button class="btn ghost" data-a="addIdea" data-id="${i}">افزودن به برنامه</button><button class="btn ghost" data-a="script" data-id="${i}">نوشتن سناریو</button></div></div>`).join(''):'')+
  (scr?`<h3>سناریو</h3><div class="card"><pre>${esc(scr)}</pre><button class="btn full" style="margin-top:12px" data-a="saveScript">ذخیره سناریو در برنامه‌ریزی</button></div>`:'')+(ai?`<h3>پیشنهاد کلود</h3><div class="card"><pre>${esc(ai)}</pre></div>`:'')},
results(){const po=S.posts.filter(p=>p.status==='Posted'),or=S.orders.filter(live);
  const sm=k=>po.reduce((s,p)=>s+num(p[k]),0),reach=sm('reach'),eng=reach?((sm('likes')+sm('saves')+sm('comments'))/reach*100).toFixed(1):'0.0';
  const rev=or.reduce((s,o)=>s+num(o.qty)*num(o.price),0),prof=or.reduce((s,o)=>s+num(o.qty)*(num(o.price)-num(o.cost)),0);
  const top=[...po].sort((a,b)=>num(b.saves)-num(a.saves)).slice(0,3);
  const src={};or.forEach(o=>src[o.source]=(src[o.source]||0)+num(o.qty)*num(o.price));
  const mx=Math.max(1,...Object.values(src));
  const units={};or.forEach(o=>{const n=prod(o.product).name;units[n]=(units[n]||0)+num(o.qty)});
  const bs=Object.entries(units).sort((a,b)=>b[1]-a[1])[0];
  return `${storageIssue?'<div class="note bad">'+esc(storageIssue)+'</div>':''}<h2>گزارش‌ها و نتایج</h2><h3>عملکرد محتوا</h3><div class="kpis"><div class="kpi"><b>${po.length}</b><span>منتشرشده</span></div><div class="kpi"><b>${NF.format(reach)}</b><span>مجموع دسترسی</span></div><div class="kpi"><b>${sm('saves')}</b><span>ذخیره‌ها</span></div><div class="kpi"><b>${eng}%</b><span>نرخ تعامل</span></div></div>
  <h3>بهترین محتوا بر اساس ذخیره</h3>${top.map(p=>`<div class="card"><div class="top"><span class="pill">${fa(p.type)}</span><span class="st">${NF.format(num(p.saves))} ذخیره</span></div><div class="h">${esc(p.title)}</div></div>`).join('')||' <p class="mute">برای مشاهده این گزارش، محتوا را منتشرشده علامت بزن و آمار آن را وارد کن.</p>'}
  <h3>عملکرد فروش</h3><div class="kpis"><div class="kpi"><b>${money(rev)}</b><span>درآمد</span></div><div class="kpi"><b class="good">${money(prof)}</b><span>سود</span></div><div class="kpi"><b>${or.length}</b><span>تعداد سفارش‌ها</span></div><div class="kpi"><b>${bs?esc(bs[0]):'-'}</b><span>پرفروش‌ترین محصول</span></div></div>
  <h3>درآمد بر اساس منبع سفارش</h3>${Object.entries(src).map(([k,v])=>`<div>${esc(fa(k))} <span class="mute">${money(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div>`).join('')||' <p class="mute">هنوز سفارشی ثبت نشده است.</p>'}
  <h3>اطلاعات و پشتیبان‌گیری</h3><p class="mute">${canSave?'اطلاعات در همین مرورگر و دستگاه به‌صورت خودکار ذخیره می‌شود.':'ذخیره‌سازی در این مرورگر مسدود است؛ تا رفع مشکل، به ذخیره خودکار اعتماد نکن.'} ذخیره خودکار جای فایل پشتیبان جداگانه را نمی‌گیرد.</p>
  <div class="note">${backupReminder()}</div>
  <div class="row"><button class="btn full" data-a="backupDownload">دانلود فایل پشتیبان</button></div>

  <p class="mute">بازیابی، اطلاعات فعلی را با اطلاعات فایل جایگزین می‌کند. پیش از آن، برنامه یک نسخه ایمنی از اطلاعات فعلی می‌سازد.</p>
  <details><summary>روش پشتیبان‌گیری متنی (جایگزین)</summary>
  <textarea id="bk" rows="3" placeholder="برای تهیه یا بازیابی نسخه متنی، اینجا استفاده کن."></textarea>
  <div class="row"><button class="btn ghost" data-a="bkShow">نمایش متن پشتیبان</button><button class="btn ghost" data-a="bkRestore">بازیابی از متن</button></div></details>
  ${hasOld()?'<div class="row"><button class="btn ghost" data-a="bkOld">نمایش نسخه پیش از به‌روزرسانی</button></div>':''}${hasSafety()?'<div class="row"><button class="btn ghost" data-a="safetyDownload">دانلود نسخه ایمنی پیش از بازیابی</button></div>':''}${hasLastGood()?'<div class="row"><button class="btn ghost" data-a="lastGoodDownload">دانلود آخرین نسخه سالم محلی</button></div>':''}
  ${S.sample?'<div class="row"><button class="btn ghost" data-a="clearSample">پاک‌کردن داده‌های نمونه</button></div>':''}`}
};

const GOALS={

proof:p=>['یک سال استفاده روزمره از '+p+'؛ تجربه واقعی مشتری','بازکردن بسته '+p+' و واکنش واقعی مشتری','چرا مشتریان دوباره '+p+' را انتخاب می‌کنند؟'],
teach:p=>['۳ راه تشخیص چرم طبیعی از مصنوعی','چطور از '+p+' مراقبت کنیم تا سال‌ها ماندگار بماند؟','پتینه چرم چیست و چرا با گذشت زمان زیباتر می‌شود؟'],

const ACT={
tab:id=>{tab=id;render();window.scrollTo(0,0)},
newPost:()=>postSheet(),editPost:id=>postSheet(id),newProd:()=>prodSheet(),editProd:id=>prodSheet(id),newOrder:()=>orderSheet(),editOrder:id=>orderSheet(id),

  const chosen=gen[scrIndex==null?0:scrIndex],title=chosen.title,type=chosen.type;
  let p=S.posts.find(x=>x.title===title&&x.type===type&&x.status!=='Posted');
  if(p){p.script=scr}else{p={id:uid(),type,date:dstr(1),status:'Idea',title,caption:'',script:scr,reach:'',likes:'',saves:'',comments:'',clicks:''};S.posts.push(p)}
  save();if(canSave)toast('سناریو ذخیره شد و در ویرایش محتوا هم در دسترس است.');else toast('ذخیره در مرورگر انجام نشد؛ از اطلاعات پشتیبان بگیر.');render()
},

}catch(e){toast('خواندن فایل ممکن نشد؛ یک فایل JSON پشتیبان انتخاب کن.')}} ,
bkOld:()=>{try{$('#bk').value=localStorage.getItem(KEY+'-pre-toman')||'';$('#bk').select();toast('این متن را کپی کن و در صورت نیاز از گزینه بازیابی استفاده کن')}catch(e){}},
safetyDownload:()=>{try{const d=JSON.parse(localStorage.getItem(SAFETY_KEY));downloadJSON(d,'HANA-Style-Safety-Before-Restore.json');toast('فایل نسخه ایمنی آماده دانلود شد.')}catch(e){toast('نسخه ایمنی در دسترس نیست.')}},
lastGoodDownload:()=>{try{const d=parseStored(localStorage.getItem(KEY+'-last-good'));downloadJSON(backupEnvelope(d),'HANA-Style-Last-Good.json');toast('آخرین نسخه سالم محلی آماده دانلود شد.')}catch(e){toast('نسخه سالم محلی در دسترس نیست.')}},
conv:()=>{askSheet('تبدیل مبالغ ذخیره‌شده','<p>مشخص کن هر یورو چند تومان است. این تبدیل، تمام مبالغ محصولات و سفارش‌های این برنامه را تغییر می‌دهد.</p><label>تومان به ازای هر یورو<input id="rate" type="text" inputmode="numeric" placeholder="مثلاً ۷۰۰٬۰۰۰"></label>','ادامه',()=>{
  const r=num(nd($('#rate').value));if(r<=0){toast('نرخ تبدیل معتبر وارد کن');return}
  const x=v=>Math.round(num(v)*r);S.products.forEach(p=>{p.price=x(p.price);CK.forEach(k=>p.costs[k]=x(p.costs[k]));p.cost=tot(p.costs)});S.orders.forEach(o=>{o.price=x(o.price);o.cost=x(o.cost)});S.cur='toman';save();closeSheet();render();toast('مبالغ به تومان تبدیل شدند')
})},
clearSample:()=>{const pl=samplePlan(),n=pl.products.length+pl.posts.length+pl.orders.length;
  if(!n){S.sample=false;S.sampleCleared=true;save();render();return toast('داده نمونه‌ای پیدا نشد. حالت نمونه غیرفعال شد.')}
  askSheet('پاک‌کردن اطلاعات نمونه',`<p>این کار فقط اطلاعات نمونه برنامه را حذف می‌کند: ${pl.posts.length} مورد محتوا، ${pl.products.length} محصول و ${pl.orders.length} سفارش. تمام اطلاعاتی که خودت وارد کرده‌ای حفظ می‌شوند.${pl.keptP.length?' '+pl.keptP.length+' محصول نمونه به دلیل استفاده در سفارش‌های خودت حفظ می‌شود.':''}</p><p class="mute">ابتدا یک نسخه پشتیبان ایمنی از اطلاعاتت ذخیره می‌شود.</p>`,'حذف اطلاعات نمونه',()=>{
    try{localStorage.setItem(KEY+'-pre-clear',JSON.stringify(S))}catch(e){return toast('نسخه ایمنی ذخیره نشد؛ چیزی حذف نشد.')}
    const ids=k=>new Set(pl[k].map(x=>x.id)),P=ids('products'),C=ids('posts'),O=ids('orders');
    S.products=S.products.filter(x=>!P.has(x.id));S.posts=S.posts.filter(x=>!C.has(x.id));S.orders=S.orders.filter(x=>!O.has(x.id));
    S.sample=false;S.sampleCleared=true;
    if(sel.p&&!S.products.some(p=>p.name===sel.p))sel.p=(S.products[0]||{}).name||'';
    save();closeSheet();render();
    toast(canSave?'اطلاعات نمونه حذف شد و اطلاعات ثبت‌شده توسط تو حفظ شدند.':'حذف انجام شد، اما مرورگر نتوانست تغییرات را ذخیره کند.')})}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)ACT[b.dataset.a](b.dataset.id)});
document.addEventListener('change',e=>{const v=e.target.dataset.v;if(v)sel[v]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='backupFile'&&e.target.files&&e.target.files[0])ACT.fileRestore(e.target.files[0])});

const TABS=[['plan','برنامه‌ریزی'],['products','محصولات'],['orders','سفارش‌ها'],['ideas','ایده‌ها'],['results','گزارش‌ها']];
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-a="tab" data-id="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
  $('#sub').textContent=S.sample?'استودیو · داده‌های نمونه (از بخش گزارش‌ها قابل پاک‌کردن)':'استودیو مدیریت برند';
  $('#main').innerHTML=VIEWS[tab]();
}
S=load();if(!S.products&&!storageIssue)S=seed();sel.p=(S.products[0]||{}).name||'';if(!storageIssue)save();render();
claude_init();
function claude_init(){try{window.claude&&window.claude.use('sample').then(s=>{if(s){aiOn=true;if(tab==='ideas')render()}}).catch(()=>{})}catch(e){}}
</script>

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
